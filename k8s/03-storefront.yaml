apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: troubleshooting-lab
spec:
  replicas: 1
  # Intentional lab downtime: one Pod makes the bad configuration unambiguous.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storefront
          image: troubleshooting-storefront:1.0
          imagePullPolicy: Never
          env:
            - name: APP_ROLE
              value: storefront
            - name: PORT
              value: "8080"
            - name: CATALOG_URL
              valueFrom:
                configMapKeyRef:
                  name: storefront-config
                  key: CATALOG_URL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          # A bad dependency must not trigger endless container restarts.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: troubleshooting-lab
spec:
  selector:
    app: storefront
  ports:
    - name: http
      port: 8080
      targetPort: http
