apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: troubleshooting-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog
          image: troubleshooting-storefront:1.0
          imagePullPolicy: Never
          env:
            - name: APP_ROLE
              value: catalog
            - name: PORT
              value: "8081"
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: troubleshooting-lab
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8081
      targetPort: http
